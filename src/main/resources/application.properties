# =====================================================
# FitFactory Backend - Application Configuration
# =====================================================
# En producción, definir estas variables de entorno:
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, JWT_EXPIRATION_MS
# NUNCA commitear credenciales reales a control de versiones.
# =====================================================
spring.application.name=FitFactoryBackend

# ===== SERVIDOR =====
server.port=${SERVER_PORT:8082}

# ===== BASE DE DATOS POSTGRESQL / SUPABASE =====
# En Render define DB_URL, DB_USERNAME y DB_PASSWORD como variables de entorno.
# La URL debe usar el prefijo jdbc:postgresql:// y sslmode=require.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.sbggkodqktoxjmyaggxm}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
# En producción cambiar a: validate después de aplicar migraciones.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Desactivar en producción para no exponer queries.
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# En producción: definir JWT_SECRET con una cadena aleatoria de 64+ caracteres.
fitfactory.app.jwtSecret=${JWT_SECRET:FitFactory2026SuperSecretKeyParaHMACsha256MustBe64CharsOrMoreForSecurity!!}
fitfactory.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ===== LOGGING =====
logging.level.com.fitfactory=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
server.error.include-stacktrace=never
server.error.include-message=never

# ===== SPRING MAIL =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:fitfactory.noreply@gmail.com}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
fitfactory.mail.from=${MAIL_FROM:FitFactory <fitfactory.noreply@gmail.com>}
fitfactory.mail.otp-expiry-minutes=${OTP_EXPIRY_MINUTES:15}

# ===== SWAGGER UI / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
